{{ define "title" }}jmatta admin - writing{{ end }}

{{ define "styles" }}
<style>
    form {
        width: 75vh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 2rem;
    }

    .inputs-container {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        text-align: center;
    }

    input, textarea {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        resize: vertical;
    }

    textarea {
        height: 150px;
    }

    input:focus, textarea:focus {
        outline: none;
        border-color: #0e6ff5;
    }

    input[type=submit] {
        background-color: #af3f94;
        color: #f0f0f0;
        padding: 12px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    label {
        text-transform: uppercase;
    }

    .errors {
        color: red;
        text-align: center;
    }
    
    .errors ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
    }
    
    .errors li {
        margin: 0.5rem 0;
    }
</style>
{{ end }}

{{ define "content" }}

{{ if .Errors }}
<div class="errors">
    <ul>
        {{ range .Errors }}
        <li>{{ . }}</li>
        {{ end }}
    </ul>
</div>
{{ end }}

<form method="post">
    <div class="inputs-container">
        <label for="title">Title</label>
        <input type="text" name="title" id="title" value="{{ with .Title }}{{ . }}{{ end }}">
    </div>

    <div class="inputs-container">
        <label for="content">Content</label>
        <textarea name="content" id="content">{{ with .Content }}{{ . }}{{ end }}</textarea>
    </div>

    <input type="submit" value="Submit">
</form>

{{ end }}
